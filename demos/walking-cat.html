<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫步的小貓 - SVG 動畫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #7CFC00 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #333;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
        }
        
        .scene-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        
        svg {
            display: block;
            border-radius: 10px;
        }
    </style>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <h1>🐱 漫步的小貓</h1>
    
    <div class="scene-container">
        <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" width="800" height="400">
            <!-- 天空背景 -->
            <rect width="800" height="200" fill="#87CEEB"/>
            
            <!-- 草地 -->
            <rect y="200" width="800" height="200" fill="#90EE90"/>
            
            <!-- 太陽 -->
            <circle cx="700" cy="60" r="40" fill="#FFD700">
                <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;0.8;1" dur="4s" repeatCount="indefinite"/>
            </circle>
            
            <!-- 雲朵 -->
            <g opacity="0.8">
                <ellipse cx="100" cy="80" rx="40" ry="25" fill="white">
                    <animate attributeName="cx" values="100;150;100" dur="20s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="130" cy="70" rx="50" ry="30" fill="white">
                    <animate attributeName="cx" values="130;180;130" dur="20s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="70" cy="70" rx="35" ry="22" fill="white">
                    <animate attributeName="cx" values="70;120;70" dur="20s" repeatCount="indefinite"/>
                </ellipse>
            </g>
            
            <!-- 小貓群組 - 整體移動 -->
            <g id="cat">
                <animateTransform attributeName="transform"
                                  type="translate"
                                  values="-150,0; 950,0; -150,0"
                                  dur="12s"
                                  repeatCount="indefinite"/>
                
                <!-- 尾巴 -->
                <path d="M 80,200 Q 60,180 50,160 Q 45,150 50,140" 
                      fill="none" stroke="#FF8C00" stroke-width="12" stroke-linecap="round">
                    <animate attributeName="d" 
                             values="M 80,200 Q 60,180 50,160 Q 45,150 50,140;
                                     M 80,200 Q 50,170 40,150 Q 35,140 45,130;
                                     M 80,200 Q 60,180 50,160 Q 45,150 50,140"
                             dur="0.8s" repeatCount="indefinite"/>
                </path>
                
                <!-- 後腿 (左) -->
                <ellipse cx="90" cy="230" rx="15" ry="25" fill="#FF8C00">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      values="-20 90 210; 20 90 210; -20 90 210"
                                      dur="0.6s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 後腿 (右) -->
                <ellipse cx="110" cy="230" rx="15" ry="25" fill="#FFA500">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      values="20 110 210; -20 110 210; 20 110 210"
                                      dur="0.6s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 身體 -->
                <ellipse cx="140" cy="200" rx="70" ry="45" fill="#FFA500"/>
                
                <!-- 身體條紋 -->
                <path d="M 100,180 Q 120,200 110,220" fill="none" stroke="#FF8C00" stroke-width="8" opacity="0.6"/>
                <path d="M 130,175 Q 140,200 135,225" fill="none" stroke="#FF8C00" stroke-width="8" opacity="0.6"/>
                <path d="M 160,180 Q 165,200 160,220" fill="none" stroke="#FF8C00" stroke-width="8" opacity="0.6"/>
                
                <!-- 前腿 (左) -->
                <ellipse cx="170" cy="230" rx="12" ry="22" fill="#FF8C00">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      values="20 170 210; -20 170 210; 20 170 210"
                                      dur="0.6s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 前腿 (右) -->
                <ellipse cx="185" cy="230" rx="12" ry="22" fill="#FFA500">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      values="-20 185 210; 20 185 210; -20 185 210"
                                      dur="0.6s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 頭部 -->
                <g>
                    <!-- 頭 -->
                    <circle cx="200" cy="170" r="45" fill="#FFA500"/>
                    
                    <!-- 耳朵 (左) -->
                    <path d="M 165,140 L 155,100 L 185,125 Z" fill="#FFA500"/>
                    <path d="M 168,135 L 162,110 L 178,128 Z" fill="#FFB6C1"/>
                    
                    <!-- 耳朵 (右) -->
                    <path d="M 235,140 L 245,100 L 215,125 Z" fill="#FFA500"/>
                    <path d="M 232,135 L 238,110 L 222,128 Z" fill="#FFB6C1"/>
                    
                    <!-- 眼睛 (左) -->
                    <ellipse cx="185" cy="165" rx="10" ry="12" fill="#32CD32"/>
                    <ellipse cx="187" cy="165" rx="4" ry="8" fill="black">
                        <animate attributeName="ry" values="8;0.5;8" dur="4s" repeatCount="indefinite"/>
                    </ellipse>
                    <circle cx="189" cy="162" r="3" fill="white"/>
                    
                    <!-- 眼睛 (右) -->
                    <ellipse cx="215" cy="165" rx="10" ry="12" fill="#32CD32"/>
                    <ellipse cx="213" cy="165" rx="4" ry="8" fill="black">
                        <animate attributeName="ry" values="8;0.5;8" dur="4s" repeatCount="indefinite"/>
                    </ellipse>
                    <circle cx="211" cy="162" r="3" fill="white"/>
                    
                    <!-- 鼻子 -->
                    <path d="M 195,180 L 205,180 L 200,188 Z" fill="#FF69B4"/>
                    
                    <!-- 嘴巴 -->
                    <path d="M 200,188 Q 190,195 185,190" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
                    <path d="M 200,188 Q 210,195 215,190" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
                    
                    <!-- 鬍鬚 (左) -->
                    <line x1="170" y1="180" x2="140" y2="175" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    <line x1="170" y1="185" x2="140" y2="185" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    <line x1="170" y1="190" x2="140" y2="195" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    
                    <!-- 鬍鬚 (右) -->
                    <line x1="230" y1="180" x2="260" y2="175" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    <line x1="230" y1="185" x2="260" y2="185" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    <line x1="230" y1="190" x2="260" y2="195" stroke="black" stroke-width="1.5" opacity="0.6"/>
                    
                    <!-- 頭部條紋 -->
                    <path d="M 200,130 L 195,145 L 205,145 Z" fill="#FF8C00" opacity="0.7"/>
                    <path d="M 180,135 Q 185,145 180,155" fill="none" stroke="#FF8C00" stroke-width="4" opacity="0.6"/>
                    <path d="M 220,135 Q 215,145 220,155" fill="none" stroke="#FF8C00" stroke-width="4" opacity="0.6"/>
                </g>
                
                <!-- 身體上下起伏 (走路節奏) -->
                <animateTransform attributeName="transform"
                                  type="translate"
                                  values="0,0; 0,-5; 0,0"
                                  dur="0.3s" repeatCount="indefinite" additive="sum"/>
            </g>
            
            <!-- 草地裝飾 - 花朵 -->
            <g transform="translate(300, 320)">
                <circle r="8" fill="#FF69B4"/>
                <circle cx="-8" cy="-5" r="6" fill="#FFB6C1"/>
                <circle cx="8" cy="-5" r="6" fill="#FFB6C1"/>
                <circle cx="-5" cy="8" r="6" fill="#FFB6C1"/>
                <circle cx="5" cy="8" r="6" fill="#FFB6C1"/>
                <circle cy="-8" r="6" fill="#FFB6C1"/>
                <circle r="4" fill="#FFD700"/>
                <animateTransform attributeName="transform"
                                  type="scale"
                                  values="1;1.1;1"
                                  dur="3s" repeatCount="indefinite" additive="sum"/>
            </g>
            
            <g transform="translate(500, 350)">
                <circle r="6" fill="#9370DB"/>
                <circle cx="-6" cy="-4" r="5" fill="#BA55D3"/>
                <circle cx="6" cy="-4" r="5" fill="#BA55D3"/>
                <circle cx="-4" cy="6" r="5" fill="#BA55D3"/>
                <circle cx="4" cy="6" r="5" fill="#BA55D3"/>
                <circle cy="-6" r="5" fill="#BA55D3"/>
                <circle r="3" fill="#FFD700"/>
                <animateTransform attributeName="transform"
                                  type="scale"
                                  values="1;1.15;1"
                                  dur="2.5s" repeatCount="indefinite" additive="sum"/>
            </g>
            
            <g transform="translate(650, 330)">
                <circle r="7" fill="#FF6347"/>
                <circle cx="-7" cy="-4" r="5" fill="#FF7F50"/>
                <circle cx="7" cy="-4" r="5" fill="#FF7F50"/>
                <circle cx="-4" cy="7" r="5" fill="#FF7F50"/>
                <circle cx="4" cy="7" r="5" fill="#FF7F50"/>
                <circle cy="-7" r="5" fill="#FF7F50"/>
                <circle r="3" fill="#FFD700"/>
                <animateTransform attributeName="transform"
                                  type="scale"
                                  values="1;1.1;1"
                                  dur="3.5s" repeatCount="indefinite" additive="sum"/>
            </g>
            
            <!-- 蝴蝶 -->
            <g>
                <animateTransform attributeName="transform"
                                  type="translate"
                                  values="400,150; 450,120; 500,150; 450,180; 400,150"
                                  dur="8s" repeatCount="indefinite"/>
                
                <!-- 翅膀 (左) -->
                <ellipse cx="-10" cy="0" rx="15" ry="20" fill="#FF69B4" opacity="0.8">
                    <animateTransform attributeName="transform"
                                      type="scale"
                                      values="1,1; 0.3,1; 1,1"
                                      dur="0.2s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 翅膀 (右) -->
                <ellipse cx="10" cy="0" rx="15" ry="20" fill="#FF69B4" opacity="0.8">
                    <animateTransform attributeName="transform"
                                      type="scale"
                                      values="1,1; 0.3,1; 1,1"
                                      dur="0.2s" repeatCount="indefinite"/>
                </ellipse>
                
                <!-- 身體 -->
                <ellipse cy="5" rx="3" ry="10" fill="#333"/>
            </g>
            
            <!-- 文字說明 -->
            <text x="400" y="380" text-anchor="middle" fill="#333" font-size="14" font-family="Arial, sans-serif" opacity="0.7">
                一隻橘色小貓在草地上散步 🐾
            </text>
        </svg>
    </div>
</body>
</html>
