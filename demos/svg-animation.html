<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 動畫展示 - OpenClaw</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #ffd700;
        }
        
        p {
            margin-bottom: 30px;
            color: #a0a0a0;
            font-size: 14px;
        }
        
        .svg-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        svg {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <h1>🎨 SVG 動畫展示</h1>
    <p>由 阿呆 生成的脈衝呼吸效果動畫</p>
    
    <div class="svg-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="300" height="300">
            <defs>
                <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1">
                        <animate attributeName="stop-color" 
                                 values="#ffd700;#ff6b6b;#4ecdc4;#ffd700" 
                                 dur="4s" 
                                 repeatCount="indefinite"/>
                    </stop>
                    <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1">
                        <animate attributeName="stop-color" 
                                 values="#ff8c00;#ee5a6f;#44a08d;#ff8c00" 
                                 dur="4s" 
                                 repeatCount="indefinite"/>
                    </stop>
                </radialGradient>
                
                <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8"/>
                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8"/>
                </linearGradient>
            </defs>
            
            <rect width="200" height="200" fill="#1a1a2e"/>
            
            <g transform="translate(100,100)">
                <circle r="80" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.6">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      from="0 0 0"
                                      to="360 0 0"
                                      dur="10s"
                                      repeatCount="indefinite"/>
                </circle>
                
                <circle r="70" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.4">
                    <animateTransform attributeName="transform"
                                      type="rotate"
                                      from="360 0 0"
                                      to="0 0 0"
                                      dur="8s"
                                      repeatCount="indefinite"/>
                </circle>
                
                <circle r="40" fill="url(#centerGradient)">
                    <animate attributeName="r" 
                             values="35;45;35" 
                             dur="2s" 
                             repeatCount="indefinite"/>
                    <animate attributeName="opacity" 
                             values="0.8;1;0.8" 
                             dur="2s" 
                             repeatCount="indefinite"/>
                </circle>
                
                <circle r="20" fill="#ffffff" opacity="0.9">
                    <animate attributeName="r" 
                             values="18;22;18" 
                             dur="2s" 
                             repeatCount="indefinite"/>
                </circle>
            </g>
            
            <circle cx="30" cy="50" r="5" fill="#ff6b6b" opacity="0.7">
                <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
            </circle>
            
            <circle cx="170" cy="150" r="4" fill="#4ecdc4" opacity="0.7">
                <animate attributeName="cy" values="150;170;150" dur="2.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
            </circle>
            
            <circle cx="150" cy="40" r="3" fill="#ffd700" opacity="0.6">
                <animate attributeName="cx" values="150;170;150" dur="4s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
            </circle>
            
            <text x="100" y="185" text-anchor="middle" fill="#ffffff" font-size="12" font-family="Arial, sans-serif" opacity="0.8">
                OpenClaw
                <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
            </text>
        </svg>
    </div>
    
    <div class="footer">
        Created by 阿呆 🐾 | 2026-02-20
    </div>
</body>
</html>
