<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 下班盲盒 - 2026年3月4日</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        .date-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .title {
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 50px;
        }

        /* 盲盒 */
        .blindbox-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .blindbox-container:hover {
            transform: scale(1.05);
        }

        .blindbox-container.shaking {
            animation: shake 0.5s ease-in-out 3;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.05); }
        }

        .blindbox {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        .blindbox.opening {
            animation: boxOpen 1s ease forwards;
        }

        @keyframes boxOpen {
            0% { transform: scale(1) rotateY(0deg); }
            30% { transform: scale(1.1) rotateY(10deg); }
            60% { transform: scale(1.2) rotateY(-10deg); }
            100% { transform: scale(0) rotateY(180deg); opacity: 0; }
        }

        /* 盒子主体 */
        .box-body {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(102, 126, 234, 0.4),
                inset 0 2px 10px rgba(255, 255, 255, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .box-body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }

        .box-icon {
            font-size: 60px;
            z-index: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .box-text {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            z-index: 1;
        }

        /* 盒子丝带 */
        .ribbon {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            background: linear-gradient(145deg, #f093fb 0%, #f5576c 100%);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
            z-index: 2;
        }

        .ribbon::before {
            content: '🎀';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
        }

        /* 结果展示 */
        .results {
            display: none;
            opacity: 0;
            transform: translateY(30px);
        }

        .results.show {
            display: block;
            animation: resultShow 0.8s ease forwards;
        }

        @keyframes resultShow {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }

        .result-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .result-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .result-emoji {
            font-size: 40px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .result-text {
            text-align: left;
        }

        .result-title {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .result-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: particleFloat 2s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 页脚 */
        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        /* 已开启状态 */
        .opened-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 10px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .title { font-size: 24px; }
            .blindbox-container { width: 160px; height: 160px; }
            .box-icon { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="date-badge">2026年3月4日 · 星期三</div>
        <h1 class="title">🎁 下班盲盒</h1>
        <p class="subtitle">点击盲盒，揭晓今天的下班命运</p>

        <div class="blindbox-container" id="blindbox" onclick="openBox()">
            <div class="ribbon"></div>
            <div class="blindbox" id="box">
                <div class="box-body">
                    <div class="box-icon">📦</div>
                    <div class="box-text">点击开启</div>
                </div>
            </div>
        </div>

        <div class="results" id="results">
            <!-- 交通结果 -->
            <div class="result-card">
                <div class="result-label">🚗 今日交通</div>
                <div class="result-content">
                    <div class="result-emoji">🚌</div>
                    <div class="result-text">
                        <div class="result-title">坐公交回家</div>
                        <div class="result-desc">环保又省钱，慢慢摇回家~</div>
                    </div>
                </div>
            </div>

            <!-- 晚餐结果 -->
            <div class="result-card">
                <div class="result-label">🍽️ 今日晚餐</div>
                <div class="result-content">
                    <div class="result-emoji">🍳</div>
                    <div class="result-text">
                        <div class="result-title">回家自己做</div>
                        <div class="result-desc">健康又温馨，今天做点什么好吃的呢？</div>
                    </div>
                </div>
            </div>

            <p class="opened-text">✨ 今日盲盒已开启，明天见！</p>
        </div>

        <div class="footer">Made with 💜 by 阿呆</div>
    </div>

    <script>
        let opened = false;

        function openBox() {
            if (opened) return;
            opened = true;

            const box = document.getElementById('box');
            const container = document.getElementById('blindbox');
            const results = document.getElementById('results');

            // 摇晃动画
            container.classList.add('shaking');

            setTimeout(() => {
                container.classList.remove('shaking');
                
                // 开盒动画
                box.classList.add('opening');
                
                // 粒子效果
                createParticles();

                // 显示结果
                setTimeout(() => {
                    container.style.display = 'none';
                    results.classList.add('show');
                }, 600);
            }, 1500);
        }

        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'];
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '40%';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 400 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 400 + 'px');
                particle.style.animationDelay = Math.random() * 0.3 + 's';
                container.appendChild(particle);

                setTimeout(() => particle.remove(), 2000);
            }
        }
    </script>
</body>
</html>
